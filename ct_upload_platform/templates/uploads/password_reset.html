<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - RHYTHM Repository Upload Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 50px 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .logo p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
            background: #f8f9ff;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 12px;
            border-radius: 4px;
            font-size: 13px;
            color: #334455;
            margin-bottom: 20px;
        }

        .divider {
            height: 1px;
            background: #ecf0f1;
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <div class="login-page">
    <div class="login-container">
        <div class="logo">
            <h1>Reset your password</h1>
            <p>RHYTHM Repository Upload Platform</p>
        </div>

        <div class="info-box">
            Enter the email address associated with your account and we'll send you a link to reset your password.
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_email">Email address</label>
                <input
                    type="email"
                    id="id_email"
                    name="email"
                    required
                    placeholder="Enter your email"
                    autocomplete="email"
                >
            </div>

            <button type="submit" class="login-btn">Send reset link</button>
        </form>

        <div class="divider"></div>

        <p style="text-align:center; font-size:14px; color:#7f8c8d;">
            <a href="{% url 'login-page' %}" style="color:#667eea; text-decoration:none; font-weight:600;">Back to sign in</a>
        </p>
    </div>
    </div>
{% include 'uploads/_footer.html' %}
</body>
</html>
