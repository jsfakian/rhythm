<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check your email - RHYTHM Repository Upload Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 50px 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .logo p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #3c3;
        }

        .divider {
            height: 1px;
            background: #ecf0f1;
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <div class="login-page">
    <div class="login-container">
        <div class="logo">
            <h1>Check your email</h1>
            <p>RHYTHM Repository Upload Platform</p>
        </div>

        <div class="success-message">
            If an account exists for the email address you entered, we've sent a link to reset your password. The link will expire shortly, so use it soon.
        </div>

        <div class="divider"></div>

        <p style="text-align:center; font-size:14px; color:#7f8c8d;">
            <a href="{% url 'login-page' %}" style="color:#667eea; text-decoration:none; font-weight:600;">Back to sign in</a>
        </p>
    </div>
    </div>
{% include 'uploads/_footer.html' %}
</body>
</html>
