services:
  db:
    image: postgres:15-alpine
    container_name: ct_upload_db
    environment:
      POSTGRES_DB: ${DB_NAME:-ct_upload_platform}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:6543:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    container_name: ct_upload_redis
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ct_upload_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn ct_upload_platform.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --reload"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      ORTHANC_BASE_URL: http://orthanc:8042
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-orthanc}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      orthanc:
        condition: service_started
    env_file:
      - .env
    stdin_open: true
    tty: true

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ct_upload_worker
    command: celery -A ct_upload_platform worker --loglevel=info --concurrency=2
    volumes:
      - .:/app
    environment:
      DEBUG: ${DEBUG:-False}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      ORTHANC_BASE_URL: http://orthanc:8042
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-orthanc}
    depends_on:
      - db
      - redis
      - web
      - orthanc
    env_file:
      - .env

  orthanc:
    image: orthancteam/orthanc:latest
    container_name: ct_upload_orthanc
    ports:
      - "127.0.0.1:8042:8042"
      - "127.0.0.1:4242:4242"
    volumes:
      - orthanc_data:/var/lib/orthanc/db
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen(u.Request('http://localhost:8042/system', headers={'Authorization': 'Basic UkVEQUNURUQ6UkVEQUNURUQ='}))\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    container_name: ct_upload_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_volume:/srv/static:ro
      - ./media:/srv/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  orthanc_data:
  caddy_data:
  caddy_config:
